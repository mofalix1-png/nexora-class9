
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>NEXORA | پنل مدیریت</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#edf4ff;font-family:Tahoma,Arial}
main{width:min(900px,94%);margin:30px auto}
.card,header{background:#121d30;border:1px solid #26364f;border-radius:18px;padding:20px;margin-bottom:16px}
.logo{font-size:26px;font-weight:bold;color:#75a7ff}
h1{font-size:22px}
p{color:#9aabc2;font-size:13px}
input,button{width:100%;padding:14px;border-radius:10px;font:inherit;margin:8px 0}
input{background:#0b1424;color:white;border:1px solid #34445d}
button{background:#75a7ff;color:#071326;border:0;font-weight:bold;cursor:pointer}
.secondary{background:#263750;color:white}
.notice{background:#172941;padding:13px;border-radius:10px;white-space:pre-wrap}
.error{background:#49202a;color:#ffc4ce}
.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:#0b1424;padding:15px;border-radius:12px}
.num{font-size:27px;color:#75a7ff}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:right;padding:10px;border-bottom:1px solid #26364f}
.tablewrap{overflow:auto}
</style>
</head>
<body>
<main>
<header>
<div class="logo">NEXORA</div>
<p>پنل مدیریت کلاس نهم</p>
</header>

<section id="login" class="card">
<h1>ورود مدیر 🔐</h1>
<p>فقط حساب مدیر مجاز به ورود است.</p>
<form id="loginForm">
<label>ایمیل</label>
<input id="email" type="email" required placeholder="ایمیل مدیر">
<label>رمز عبور</label>
<input id="password" type="password" required placeholder="رمز عبور">
<button id="loginBtn">ورود به پنل</button>
</form>
<button class="secondary" id="forgotBtn" type="button">رمزم را فراموش کرده‌ام</button>
<div id="loginMsg" class="notice hidden"></div>
</section>

<section id="recovery" class="card hidden">
<h1>بازیابی رمز 🔑</h1>
<p>رمز جدیدت را انتخاب کن.</p>
<form id="recoveryForm">
<input id="newPassword" type="password" minlength="8" required placeholder="رمز جدید، حداقل ۸ کاراکتر">
<input id="confirmPassword" type="password" minlength="8" required placeholder="تکرار رمز جدید">
<button id="savePasswordBtn">ذخیره رمز جدید</button>
</form>
<div id="recoveryMsg" class="notice hidden"></div>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h1>داشبورد مدیریت</h1>
<p id="who"></p>
<button id="refresh">به‌روزرسانی اطلاعات</button>
<button id="logout" class="secondary">خروج</button>
</div>

<div class="stats">
<div class="stat">درس‌ها<div id="subjectsCount" class="num">—</div></div>
<div class="stat">موضوع‌ها<div id="topicsCount" class="num">—</div></div>
<div class="stat">سؤال‌ها<div id="questionsCount" class="num">—</div></div>
<div class="stat">آزمون‌ها<div id="attemptsCount" class="num">—</div></div>
</div>

<div class="card"><h2>درس‌ها</h2><div id="subjectsTable" class="tablewrap"></div></div>
<div class="card"><h2>موضوع‌ها</h2><div id="topicsTable" class="tablewrap"></div></div>
<div class="card"><h2>آخرین آزمون‌ها</h2><div id="attemptsTable" class="tablewrap"></div></div>
<div id="dashMsg" class="notice"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient(
'https://azvvkhsieyidweclbwow.supabase.co',
'sb_publishable_9m8JUluqlu5CO4GtVnYkYg_qL8QqOeI'
);
const $=id=>document.getElementById(id);

function msg(id,text,error=false){
$(id).textContent=text;
$(id).classList.remove('hidden','error');
if(error)$(id).classList.add('error');
}

function table(rows,cols){
if(!rows?.length)return '<p>اطلاعاتی وجود ندارد.</p>';
return '<table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+
'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+
String(r[c[0]]??'—').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))+
'</td>').join('')+'</tr>').join('')+'</tbody></table>';
}

async function checkAdmin(user){
const {data,error}=await db.from('admin_users')
.select('user_id').eq('user_id',user.id).maybeSingle();

if(error||!data){
await db.auth.signOut();
$('dashboard').classList.add('hidden');
$('login').classList.remove('hidden');
msg('loginMsg','این حساب اجازه مدیریت ندارد.',true);
return;
}
$('login').classList.add('hidden');
$('recovery').classList.add('hidden');
$('dashboard').classList.remove('hidden');
$('who').textContent='مدیر: '+user.email;
await loadData();
}

async function loadData(){
msg('dashMsg','در حال دریافت اطلاعات...');
try{
const count=async name=>{
const {count,error}=await db.from(name).select('*',{count:'exact',head:true});
if(error)throw error;
return count??0;
};
const [s,t,q,a]=await Promise.all([
count('subjects'),count('topics'),count('questions'),count('quiz_attempts')
]);
$('subjectsCount').textContent=s;
$('topicsCount').textContent=t;
$('questionsCount').textContent=q;
$('attemptsCount').textContent=a;

const [sr,tr,ar]=await Promise.all([
db.from('subjects').select('title,slug,is_published,sort_order').order('sort_order').limit(100),
db.from('topics').select('title,description,is_published,sort_order').order('sort_order').limit(100),
db.from('quiz_attempts').select('total_questions,correct_answers,points,completed_at').order('completed_at',{ascending:false}).limit(10)
]);
if(sr.error)throw sr.error;
if(tr.error)throw tr.error;
if(ar.error)throw ar.error;
$('subjectsTable').innerHTML=table(sr.data,[['title','نام درس'],['slug','شناسه'],['is_published','انتشار'],['sort_order','ترتیب']]);
$('topicsTable').innerHTML=table(tr.data,[['title','موضوع'],['description','توضیحات'],['is_published','انتشار'],['sort_order','ترتیب']]);
$('attemptsTable').innerHTML=table(ar.data,[['completed_at','زمان'],['total_questions','سؤال'],['correct_answers','درست'],['points','امتیاز']]);
msg('dashMsg','اطلاعات دریافت شد.');
}catch(e){msg('dashMsg','خطا: '+e.message,true);}
}

$('loginForm').addEventListener('submit',async e=>{
e.preventDefault();
$('loginBtn').disabled=true;
msg('loginMsg','در حال ورود...');
try{
const {data,error}=await db.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});
if(error)throw error;
await checkAdmin(data.user);
}catch(e){msg('loginMsg','ورود ناموفق: '+e.message,true);}
finally{$('loginBtn').disabled=false;}
});

$('forgotBtn').addEventListener('click',async()=>{
const email=$('email').value.trim();
if(!email){msg('loginMsg','ابتدا ایمیل مدیر را وارد کن.',true);return;}
$('forgotBtn').disabled=true;
msg('loginMsg','در حال ارسال ایمیل بازیابی...');
try{
const {error}=await db.auth.resetPasswordForEmail(email,{
redirectTo:location.origin+location.pathname
});
if(error)throw error;
msg('loginMsg','درخواست ارسال شد. صندوق ورودی و هرزنامه Gmail را بررسی کن.');
}catch(e){msg('loginMsg','خطا: '+e.message,true);}
finally{$('forgotBtn').disabled=false;}
});

db.auth.onAuthStateChange((event,session)=>{
if(event==='PASSWORD_RECOVERY'){
$('login').classList.add('hidden');
$('dashboard').classList.add('hidden');
$('recovery').classList.remove('hidden');
}
});

$('recoveryForm').addEventListener('submit',async e=>{
e.preventDefault();
const p=$('newPassword').value;
if(p!==$('confirmPassword').value){
msg('recoveryMsg','رمزها یکسان نیستند.',true);return;
}
$('savePasswordBtn').disabled=true;
try{
const {error}=await db.auth.updateUser({password:p});
if(error)throw error;
await db.auth.signOut();
$('recovery').classList.add('hidden');
$('login').classList.remove('hidden');
$('password').value='';
$('newPassword').value='';
$('confirmPassword').value='';
msg('loginMsg','رمز جدید ذخیره شد. حالا وارد شو.');
}catch(e){msg('recoveryMsg','خطا: '+e.message,true);}
finally{$('savePasswordBtn').disabled=false;}
});

$('refresh').addEventListener('click',loadData);
$('logout').addEventListener('click',async()=>{
await db.auth.signOut();
$('dashboard').classList.add('hidden');
$('login').classList.remove('hidden');
$('status')?.textContent;
});

db.auth.getSession().then(({data})=>{
if(data.session)checkAdmin(data.session.user);
});
</script>
</body>
</html>
